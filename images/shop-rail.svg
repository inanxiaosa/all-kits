    <path d="M240,108 L360,108 C392,108 414,116 428,128 L508,192 L472,320 L424,300 L424,596 Q424,622 398,622 L202,622 Q176,622 176,596 L176,300 L128,320 L92,192 L172,128 C186,116 208,108 240,108 Z" fill="#F7F7F5" stroke="#CFD6DE" stroke-width="4"/>
