<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="ht hd">
  <title id="ht">Three football jerseys on a rail in a small shop</title>
  <desc id="hd">A navy wall with a rail holding three jerseys: a navy home shirt, a white and red retro shirt and a cream printed shirt.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F3460"/>
      <stop offset="1" stop-color="#0A2344"/>
    </linearGradient>
    <clipPath id="c1"><path d="M240,108 L360,108 C392,108 414,116 428,128 L508,192 L472,320 L424,300 L424,596 Q424,622 398,622 L202,622 Q176,622 176,596 L176,300 L128,320 L92,192 L172,128 C186,116 208,108 240,108 Z"/></clipPath>
